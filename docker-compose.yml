services:
  mysql:
    image: mysql:8.0
    container_name: nextjs-notes-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: notes_db
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot123456']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
